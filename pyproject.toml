[project]
name = "temporal-dbos"
dynamic = ["version"]
description = "A drop-in replacement for the Temporal Python SDK, backed by DBOS Transact (Postgres) instead of a Temporal server"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "DBOS, Inc." }]
license = { text = "MIT" }
keywords = ["temporal", "dbos", "workflow", "durable-execution"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "dbos>=2.23.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "gitpython>=3.1.0",
    "hatch>=1.0.0",
    "isort>=8.0.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "sqlalchemy>=2.0",
    # Dev-only, for signature-parity tests. Never a runtime dependency (see DESIGN.md §2).
    "temporalio>=1.28,<2",
]

[build-system]
requires = ["hatchling", "gitpython>=3.1.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "code"
path = "publish/hatch_build.py"
expression = "get_version()"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
filter_files = true
atomic = true

[tool.mypy]
strict = true
files = ["temporal_dbos", "tests", "publish"]

[tool.pytest.ini_options]
addopts = "-s"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_cli_format = "%(asctime)s [%(levelname)8s] (%(name)s:%(filename)s:%(lineno)s) %(message)s"
log_cli_level = "INFO"
log_cli = true
timeout = 120 # Terminate any test that takes longer than 120 seconds
